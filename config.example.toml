# buds-notifier configuration.
# install.sh copies this to ~/.config/buds-notifier/config.toml (only if that file doesn't exist).
# Restart after editing:  systemctl --user restart buds-notifier

# REQUIRED. Public (classic) address of your paired headset. "Connect" only ever targets this device.
# Find it with:  bluetoothctl devices Paired
device_address = "AA:BB:CC:DD:EE:FF"

# REQUIRED. Prefixes of the names your headset broadcasts over Bluetooth Low Energy, for the
# nearby popup. Find them with the headset out of the case and NOT connected to this laptop:
#   bluetoothctl --timeout 15 scan le
#   bluetoothctl devices            # look for (random) entries with your headset's name
# Use names unique to YOUR headset: the custom name you gave it, and the "(XXXX)" LE Audio
# name (XXXX = last 4 hex digits of device_address). Don't use the generic "Buds3 Pro":
# every Galaxy Buds3 Pro nearby broadcasts it.
name_patterns = ["Alice's Buds3 Pro", "Galaxy Buds3 Pro (EEFF)"]

# Bluetooth adapter.
# adapter = "hci0"

# Warn once when battery drops below low_battery_percent; warn again only after it has been
# back at or above low_battery_rearm_percent (or after reconnecting).
# low_battery_percent = 15
# low_battery_rearm_percent = 20

# Minimum seconds between nearby popups (the headset broadcasts from several addresses at once).
# nearby_cooldown_seconds = 60

# Signal strength in dBm (closer to 0 = nearer). Raise nearby_rssi_found (e.g. -70) to only
# trigger when the headset is really close.
# nearby_rssi_found = -85
# nearby_rssi_lost = -95
